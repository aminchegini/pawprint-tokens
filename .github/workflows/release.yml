name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Pack and attach tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp packages with the tag version
        run: pnpm -r --filter "./packages/*" exec npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: pnpm build
      - run: pnpm test
      - name: Pack each public package
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "$RUNNER_TEMP/tarballs"
          ls -l "$RUNNER_TEMP/tarballs"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/tarballs/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
